services:
  enricher:
    image: ghcr.io/alpenl/cairn-x-enricher:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        VERSION: local
        COMMIT: local
        BUILD_DATE: local
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    # Must exceed SHUTDOWN_TIMEOUT, which bounds the whole graceful shutdown
    # (HTTP drain plus in-flight work drain). Docker SIGKILLs after this.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/cairn-x-enricher", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
