name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Lint experiment harness
        # The ablation harness is developer tooling, but its scoring logic is
        # what the published conclusions rest on, so it is held to the same
        # bar as the service.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./experiments/...
      - name: Check frontend assets
        run: make test-frontend
      - name: Build
        run: go build -trimpath ./cmd/cairn-x-enricher

  integration:
    name: Real Worker, D1 and browser contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: cairn-x-enricher
    steps:
      - name: Check out Enricher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: cairn-x-enricher
      - name: Read the pinned Worker revision
        id: contract
        run: |
          python3 - <<'PY'
          import json, os, re
          contract = json.load(open('deploy/stack-contract.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', contract['worker_revision'])
          assert contract['worker_repository'] == 'Alpenl/cairn-share'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + contract['worker_revision'] + '\n')
          PY
      - name: Check out the paired Worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Alpenl/cairn-share
          ref: ${{ steps.contract.outputs.revision }}
          path: cairn-share
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: cairn-x-enricher/go.mod
          cache-dependency-path: cairn-x-enricher/go.sum
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            cairn-share/worker/package-lock.json
            cairn-x-enricher/package-lock.json
      - name: Install local test dependencies
        timeout-minutes: 5
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix ../cairn-share/worker --no-audit --no-fund
      - name: Select the browser for contract tests
        timeout-minutes: 5
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_path" ]; then
            npx playwright install --with-deps chromium
            chrome_path="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          fi
          test -x "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Validate the paired migration boundary
        run: |
          python3 - <<'PY'
          import json, pathlib
          contract = json.load(open('deploy/stack-contract.json'))
          migrations = sorted(pathlib.Path('../cairn-share/worker/migrations').glob('*.sql'))
          assert migrations[-1].name == contract['last_worker_migration'], 'Update the tested stack contract with the Worker revision'
          PY
      - name: Run real Go and Worker integration
        run: bash tests/local-integration/run.sh
      - name: Run browser interaction regressions
        run: npm run test-browser
      - name: Run browser against the real local stack
        run: bash tests/local-integration/browser-e2e.sh

  docker:
    name: Build container
    needs: [test, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build all release platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=ci
