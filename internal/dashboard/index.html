<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cairn 收藏</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/home.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="mark" href="/">CAIRN</a>
    <form class="find" id="find-form" role="search">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="5.6" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <input id="find" type="search" maxlength="200" autocomplete="off" placeholder="搜索标题、备注、摘要或译文" aria-label="搜索收藏">
    </form>
    <a class="icon-btn" id="backstage-link" href="/backstage" title="后台" aria-label="后台">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.5"></circle>
        <path d="M10 3.4v2M10 14.6v2M3.4 10h2M14.6 10h2M5.4 5.4l1.4 1.4M13.2 13.2l1.4 1.4M14.6 5.4l-1.4 1.4M6.8 13.2l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
      </svg>
    </a>
  </header>

  <main class="stage">
    <p id="result-count" class="result-count" hidden></p>
    <div id="feature-band" class="band" hidden>今天<i></i><em id="feature-band-count"></em></div>
    <div id="feature" class="feature"></div>
    <div id="stream"></div>
    <p id="loading" class="line-note">正在读取收藏</p>
    <p id="empty" class="line-note" hidden>没有找到符合的收藏</p>
    <p id="tail" class="line-note" hidden>已经到最早的一条了</p>
    <div id="sentinel"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
