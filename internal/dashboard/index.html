<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cairn 收藏</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/home.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="mark" href="/">CAIRN</a>
    <form class="find" id="find-form" role="search">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="5.6" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <input id="find" type="search" maxlength="200" autocomplete="off" placeholder="搜索收藏" aria-label="搜索收藏">
    </form>
    <a class="icon-btn" id="backstage-link" href="/backstage" title="后台和重试" aria-label="后台和重试">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 6h3.2M10.2 6H17M3 14h6.8M13.8 14H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        <circle cx="8.2" cy="6" r="2" stroke="currentColor" stroke-width="1.5"></circle>
        <circle cx="11.8" cy="14" r="2" stroke="currentColor" stroke-width="1.5"></circle>
      </svg>
    </a>
  </header>

  <main class="stage">
    <div class="filters" aria-label="收藏筛选">
      <label>整理状态<select id="filter-curation_status"><option value="">全部</option><option value="inbox">收件箱</option><option value="kept">精选</option><option value="compiled">已编入笔记</option><option value="drop">搁置</option></select></label>
      <label>主题（可多选）<select id="filter-topics" multiple size="3" disabled aria-describedby="filter-help"></select></label>
      <label>内容功能（可多选）<select id="filter-content_functions" multiple size="3" disabled aria-describedby="filter-help"></select></label>
      <label>载体（任一）<select id="filter-carriers" multiple size="3" disabled aria-describedby="filter-help"></select></label>
      <label>潜在用途（可多选）<select id="filter-affordances" multiple size="3" disabled aria-describedby="filter-help"></select></label>
      <label>实体状态（任一）<select id="filter-entity_state" multiple size="3" aria-describedby="filter-help"><option value="not_run">未运行</option><option value="failed">失败</option><option value="completed_empty">已完成，无实体</option><option value="completed_nonempty">已完成，有实体</option><option value="stale">来源已变化</option></select></label>
      <label>形态<select id="filter-form" disabled><option value="">全部形态</option></select></label>
      <label>用途<select id="filter-use" disabled><option value="">全部用途</option></select></label>
      <label>来源<select id="filter-source"><option value="">全部来源</option><option value="x">X</option><option value="wechat">公众号</option><option value="other">其他</option></select></label>
      <label>收藏起始日期<input id="filter-since" type="date"></label>
      <label class="filter-check"><input id="filter-uncertain" type="checkbox">待确认分类</label>
      <button id="clear-filters" class="text-btn" type="button" hidden>清除筛选</button>
      <button id="export-markdown" class="icon-btn" type="button" title="导出已加载的收藏" aria-label="导出 Markdown" disabled><img src="/assets/download.svg" width="18" height="18" alt=""></button>
    </div>
    <p id="filter-help" class="line-note">同一维度匹配任一所选项，不同维度需同时满足。未选择表示不限；电脑上按住 Ctrl 或 Command 可多选。</p>
    <p id="filter-capability" class="line-note" hidden></p>
    <div id="load-error" class="load-error" role="alert" hidden><span id="load-error-text">读取收藏失败</span> <button id="retry-load" class="text-btn" type="button">重试</button></div>
    <p id="result-count" class="result-count" hidden></p>
    <div id="feature-band" class="band" hidden>今天<i></i><em id="feature-band-count"></em></div>
    <div id="feature" class="feature"></div>
    <div id="stream"></div>
    <p id="loading" class="line-note">正在读取收藏</p>
    <p id="empty" class="line-note empty-state" hidden>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14.5a.6.6 0 0 1-.94.5L12 15.6 5.44 20a.6.6 0 0 1-.94-.5V5A1.5 1.5 0 0 1 6 3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
      </svg>
      <span>没有找到符合的收藏</span>
    </p>
    <p id="tail" class="line-note" hidden>已经到最早的一条了</p>
    <div id="sentinel"></div>
  </main>

  <button id="to-top" class="to-top" type="button" title="回到顶部" aria-label="回到顶部" hidden>
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 16V4M5 8.5 10 3.5l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
