<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>阅读 · Cairn 收藏</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/reader.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="icon-btn" href="/" title="返回收藏" aria-label="返回收藏">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M12 4.5 6.5 10l5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </a>
    <div></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="read-process" class="text-btn" type="button" hidden>重新处理</button>
      <a class="icon-btn" id="read-source" href="/" target="_blank" rel="noopener noreferrer" title="打开原帖" aria-label="打开原帖">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M8 4.5H5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5 16.5h9a1.5 1.5 0 0 0 1.5-1.5v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          <path d="M11.5 3.5h5v5M16.5 3.5 9 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <p id="read-loading" class="line-note">正在读取收藏内容</p>
    <p id="read-error" class="line-note" hidden>无法读取这条收藏</p>

    <article id="read-article" class="read" hidden>
      <p id="read-date" class="read-date"></p>
      <h1 id="read-title" class="read-title"></h1>
      <p id="read-note" class="read-note" hidden></p>
      <p id="read-lede" class="read-lede"></p>
      <div id="read-figures"></div>
      <div id="read-body" class="read-body"></div>

      <div id="read-original-block" hidden>
        <div class="read-rule"></div>
        <button id="read-toggle" class="read-toggle" type="button" aria-expanded="false">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6.5 8 10.5l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span id="read-toggle-label">展开原文</span>
        </button>
        <div id="read-original" class="read-original" hidden></div>
      </div>

      <div id="read-links" class="read-links"></div>

      <a id="read-next" class="read-next" href="/" hidden>
        <div class="lbl">下一条</div>
        <div class="ttl" id="read-next-title"></div>
      </a>
    </article>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
