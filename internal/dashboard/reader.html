<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>收藏详情 · Cairn 收藏阅读库</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/reader.js" defer></script>
</head>
<body>
  <header class="site-header compact-header">
    <div class="shell header-row">
      <div class="brand-block">
        <a class="back-link" href="/">返回收藏列表</a>
        <div class="build-row">
          <span class="version-badge">当前版本 <strong id="current-version">读取中</strong></span>
          <span id="service-meta" class="service-meta">正在连接服务</span>
        </div>
      </div>
      <div class="service-state" aria-live="polite">
        <span id="state-dot" class="state-dot"></span>
        <span id="state-label">连接中</span>
      </div>
    </div>
  </header>

  <main class="reader-page">
    <div id="reader-loading" class="reader-shell loading-state">正在读取收藏内容</div>
    <div id="reader-error" class="reader-shell empty-state" hidden>无法读取这条收藏</div>
    <article id="reader-article" hidden>
      <div class="reader-shell article-header">
        <div class="reader-status-row">
          <span id="reader-status" class="badge pending">待处理</span>
          <span id="reader-meta" class="meta"></span>
        </div>
        <h1 id="reader-title" class="reader-title">AI 标题待生成</h1>
        <div id="reader-note" class="manual-note-band" hidden>
          <span>手动备注</span>
          <p id="reader-note-text"></p>
        </div>
        <div class="reader-actions">
          <a id="reader-source" class="button secondary" href="#" target="_blank" rel="noopener noreferrer">查看 X 原帖</a>
          <button id="reader-process" class="button" type="button">立即处理</button>
        </div>
        <p id="reader-error-message" class="error" hidden></p>
      </div>

      <section id="reader-gallery-section" class="reader-band gallery-band" hidden>
        <div class="reader-shell">
          <h2>原帖图片</h2>
          <div id="reader-gallery" class="image-gallery"></div>
        </div>
      </section>

      <section class="reader-shell summary-section">
        <p class="section-label">AI 摘要</p>
        <p id="reader-summary" class="summary-text"></p>
      </section>

      <section class="reader-band text-band">
        <div class="reader-shell bilingual-grid">
          <section class="reading-column">
            <div class="column-heading">
              <h2>原始语言全文</h2>
              <span id="reader-language" class="language-tag">未知语言</span>
            </div>
            <div id="reader-original" class="article-text"></div>
          </section>
          <section class="reading-column translated-column">
            <div class="column-heading">
              <h2>简体中文全文</h2>
              <span class="language-tag">简体中文</span>
            </div>
            <div id="reader-translated" class="article-text"></div>
          </section>
        </div>
      </section>

      <section id="reader-links-section" class="reader-shell related-section" hidden>
        <h2>相关链接</h2>
        <div id="reader-links" class="reader-links"></div>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <span id="build-info">Cairn X Enricher</span>
      <nav class="footer-links" aria-label="服务接口">
        <a href="/healthz">健康状态</a>
        <a href="/status">运行详情</a>
      </nav>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
