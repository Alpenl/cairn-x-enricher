<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>阅读 · Cairn 收藏</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/curation-v2.js" defer></script>
  <script src="/assets/reader.js" defer></script>
</head>
<body>
  <header class="top">
    <a id="read-back" class="icon-btn" href="/" title="返回收藏" aria-label="返回收藏">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M12 4.5 6.5 10l5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </a>
    <div></div>
    <div class="read-actions">
      <button id="read-export" class="icon-btn" type="button" title="导出这条收藏" aria-label="导出 Markdown" disabled><img src="/assets/download.svg" width="18" height="18" alt=""></button>
      <button id="read-process" class="text-btn" type="button" hidden>重新处理</button>
      <a class="icon-btn" id="read-source" href="/" target="_blank" rel="noopener noreferrer" title="打开原帖" aria-label="打开原帖">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M8 4.5H5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5 16.5h9a1.5 1.5 0 0 0 1.5-1.5v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
          <path d="M11.5 3.5h5v5M16.5 3.5 9 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <p id="read-loading" class="line-note">正在读取收藏内容</p>
    <p id="read-error" class="line-note" hidden>无法读取这条收藏</p>

    <article id="read-article" class="read" hidden>
      <p id="read-date" class="read-date"></p>
      <h1 id="read-title" class="read-title"></h1>
      <p id="read-note" class="read-note" hidden></p>
      <div id="read-meta"></div>
      <p id="read-why" class="read-why" hidden></p>
      <details id="read-curation" class="curation">
        <summary>整理收藏</summary>
        <p id="curation-error" class="curation-error" role="alert" hidden>无法读取标签词表 <button id="retry-taxonomy" class="text-btn" type="button">重试</button></p>
        <form id="curation-form">
          <fieldset id="curation-fields" disabled>
            <label>收藏原因<textarea id="curation-why" maxlength="200" rows="2"></textarea></label>
            <div id="why-suggestion-block" class="why-suggestion" hidden><span class="suggestion-label">AI 用途建议</span><p id="why-suggestion"></p><button id="use-suggestion" class="text-btn" type="button">采用建议</button></div>
            <fieldset class="topic-fields"><legend>主题 <span id="topic-count">0/3</span></legend><div id="curation-topics" class="topic-options"></div></fieldset>
            <div class="curation-selects">
              <label>形态<select id="curation-form-value"></select></label>
              <label>用途<select id="curation-use"></select></label>
              <label>整理状态<select id="curation-status"><option value="inbox">收件箱</option><option value="kept">精选</option><option value="compiled">已编入笔记</option><option value="drop">搁置</option></select></label>
            </div>
            <div class="curation-actions"><button id="confirm-classification" class="text-btn" type="button" hidden>确认这些标签</button><button id="reset-classification" class="text-btn" type="button" hidden>恢复自动分类</button><span id="curation-dirty" hidden>未保存</span><button id="save-curation" class="text-btn" type="submit">保存整理</button></div>
          </fieldset>
        </form>
      </details>
      <p id="read-entities" class="read-entities" hidden></p>
      <details id="v2-curation" class="curation" hidden>
        <summary>多维整理（v2）</summary>
        <p id="v2-status" class="line-note" role="status" aria-live="polite" hidden></p>
        <div id="v2-topics" class="v2-dimension"></div>
        <div id="v2-content_functions" class="v2-dimension"></div>
        <div id="v2-carriers" class="v2-dimension"></div>
        <div id="v2-affordances" class="v2-dimension"></div>
        <p id="v2-folded-note" class="line-note" hidden></p>
        <span id="v2-dirty" hidden>未保存</span>
      </details>
      <p id="read-lede" class="read-lede"></p>
      <div id="read-figures"></div>
      <div id="read-body" class="read-body"></div>

      <div id="read-original-block" hidden>
        <div class="read-rule"></div>
        <button id="read-toggle" class="read-toggle" type="button" aria-expanded="false">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6.5 8 10.5l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span id="read-toggle-label">展开原文</span>
        </button>
        <div id="read-original" class="read-original" hidden></div>
      </div>

      <div id="read-links" class="read-links"></div>

      <a id="read-next" class="read-next" href="/" hidden>
        <div class="lbl">下一条</div>
        <div class="ttl" id="read-next-title"></div>
      </a>
    </article>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
