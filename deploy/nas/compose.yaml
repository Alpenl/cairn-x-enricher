services:
  enricher:
    image: ghcr.io/alpenl/cairn-x-enricher:0.6.0
    container_name: cairn-x-enricher
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
    ports:
      - "8088:8080"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    # Must exceed SHUTDOWN_TIMEOUT, which bounds the whole graceful shutdown
    # (HTTP drain plus in-flight work drain). Docker SIGKILLs after this.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/cairn-x-enricher", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
